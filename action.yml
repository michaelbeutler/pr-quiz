name: PR Quiz
description: >-
  Quizzes pull request approvers with Claude-generated multiple-choice questions about the change.
  An approval only counts once every question is answered correctly.
author: pr-quiz
branding:
  icon: help-circle
  color: purple

inputs:
  github-token:
    description: >-
      Token used to comment, review, dismiss approvals, re-request reviews and set the commit status.
      Defaults to the workflow's GITHUB_TOKEN (the bot then appears as github-actions[bot]).
      Pass a GitHub App installation token to give the bot its own name.
    default: ${{ github.token }}
  anthropic-api-key:
    description: Anthropic API key (console.anthropic.com). Used when set; takes precedence over the OAuth token.
    required: false
  claude-code-oauth-token:
    description: >-
      Claude subscription token created with `claude setup-token` (or by `/install-github-app` in Claude Code).
      Questions are then generated by the Claude Code CLI, which is installed automatically if missing.
    required: false
  model:
    description: Claude model used to write and verify the questions.
    default: claude-opus-5-5
  effort:
    description: Reasoning effort (low, medium, high, xhigh, max).
    default: high
  questions:
    description: Number of questions per quiz (1-10).
    default: "3"
  options-per-question:
    description: Number of answer options per question (3-6).
    default: "4"
  verify-questions:
    description: >-
      Let a second, blind Claude pass answer every generated question and drop the ones it gets wrong or
      finds ambiguous. Roughly doubles token usage, but protects reviewers from broken answer keys.
    default: "true"
  require-all-approvers:
    description: >-
      true: every current approver must pass their quiz before the gate turns green.
      false: one passing reviewer is enough.
    default: "true"
  max-attempts:
    description: Failed attempts allowed per reviewer and pull request before no new quiz is generated (0 = unlimited).
    default: "5"
  submit-reviews:
    description: >-
      Let the bot submit REQUEST_CHANGES while a quiz is pending and APPROVE once it passes.
      Approving needs "Allow GitHub Actions to create and approve pull requests" when using GITHUB_TOKEN.
    default: "true"
  status-context:
    description: Name of the commit status. Mark it as required in branch protection or a ruleset.
    default: pr-quiz
  command:
    description: Comment command that lets a reviewer request a quiz without approving first (needed for pull requests from forks).
    default: /pr-quiz
  ignore-paths:
    description: Newline or comma separated globs of files to leave out of the quiz (added to lockfile/minified/snapshot defaults).
    default: ""
  max-diff-chars:
    description: Character budget for the diff sent to Claude. Larger diffs are truncated per file.
    default: "200000"
  include-file-context:
    description: Also send the full post-change contents of modified files (within budget) so questions can cover how changes fit in.
    default: "true"
  extra-instructions:
    description: Extra guidance for the question writer, e.g. "Focus on security" or "Write the questions in German".
    default: ""
  state-secret:
    description: >-
      Secret used to encrypt the answer key stored in the quiz comment. Defaults to a key derived from the
      Claude credential; set it explicitly if you rotate credentials often.
    required: false
  pr-number:
    description: Pull request to reconcile (for workflow_dispatch). Normally taken from the event.
    required: false
  claude-code-version:
    description: Claude Code version to install when using claude-code-oauth-token and `claude` is not on PATH.
    default: stable

outputs:
  gate:
    description: "State of the quiz gate after this run: passed, pending, error or skipped."
  actions:
    description: JSON array describing what the bot did in this run.

runs:
  using: node24
  main: dist/index.cjs
